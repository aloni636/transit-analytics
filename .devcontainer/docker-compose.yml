services:
  spark-devcontainer:
    # NOTE: we make hostname consistent to not have to resolve random generated 
    #       container hostname when connecting to the standalone Spark cluster
    hostname: learning-scala
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
      # See Dockerfile for permission configurations
      - spark-events:/var/spark-events
      - spark-work:/opt/spark/work
      - coursier-cache:/home/vscode/.cache/coursier
      - codex-cache:/home/vscode/.codex
    # network_mode: service:kafka
    command: sleep infinity

  nodejs-devcontainer:
    build:
      context: ./fetchers
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
      - codex-cache:/home/node/.codex
      - aws-cache:/home/node/.aws
    command: sleep infinity

  # https://docs.rustfs.com/installation/container#docker-compose-installation
  # grant the necessary permissions to RUSTFS volumes path
  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - ../data/s3:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../data/s3/data:/data
      - ../data/s3/logs:/logs
    environment:
      - RUSTFS_OBS_LOG_DIRECTORY=/logs
      - RUSTFS_ADDRESS=:9000
      # expose console for port forwarding
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true

  # Future orchestration uses MWAA Serverless YAML workflows to invoke Lambda.
  # There is no equivalent local image; see https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/workflows.html

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-config:/mnt/shared/config
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

volumes:
  # spark-devcontainer
  spark-events: # Main store for Spark History Server
  spark-work: # Per worker stdout/stderr used by Spark History Server UI
  coursier-cache: # Persist coursier cache between container restarts

  # credentials & dx
  codex-cache: # Persist codex auth and sessions between container restarts
  aws-cache:

  # kafka
  kafka-data:
  kafka-config:
