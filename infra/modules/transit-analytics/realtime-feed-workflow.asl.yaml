Comment: Manually collect realtime feeds until stopAt; continue in a new execution every 1000 attempts.
QueryLanguage: JSONPath
StartAt: ValidateCollection
States:
  ValidateCollection:
    Type: Choice
    QueryLanguage: JSONata
    Choices:
      - Condition: >-
          {% ($minimums := ${realtime_minimums}; $type($states.input.feedKey) = 'string' and $exists($lookup($minimums, $states.input.feedKey)) and $type($states.input.pollingSeconds) = 'number' and $states.input.pollingSeconds = $floor($states.input.pollingSeconds) and $states.input.pollingSeconds >= $lookup($minimums, $states.input.feedKey) and $type($states.input.stopAt) = 'string' and $exists($match($states.input.stopAt, /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|[+-][0-9]{2}:[0-9]{2})$/))) %}
        Next: InitializeCollection
    Default: InvalidCollection
  InitializeCollection:
    Type: Pass
    QueryLanguage: JSONata
    Output: "{% {'feedKey': $states.input.feedKey, 'pollingSeconds': $states.input.pollingSeconds, 'stopAt': $fromMillis($floor($toMillis($states.input.stopAt) / 1000) * 1000), 'iteration': {'value': 0}} %}"
    Next: CheckDeadline
  CheckDeadline:
    Type: Choice
    QueryLanguage: JSONata
    Choices:
      - Condition: "{% $millis() >= $toMillis($states.input.stopAt) %}"
        Next: CollectionComplete
    Default: CheckIteration
  CheckIteration:
    Type: Choice
    Choices:
      - Variable: $.iteration.value
        NumericGreaterThanEquals: 1000
        Next: ContinueCollection
    Default: FetchRealtimeFeed
  FetchRealtimeFeed:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: "${realtime_fetcher_arn}"
      Payload:
        feedKey.$: $.feedKey
        scheduledTime.$: $$.State.EnteredTime
    ResultPath: null
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: null
        Next: IncrementIteration
    Next: IncrementIteration
  IncrementIteration:
    Type: Pass
    Parameters:
      value.$: States.MathAdd($.iteration.value, 1)
    ResultPath: $.iteration
    Next: WaitForSample
  WaitForSample:
    Type: Wait
    QueryLanguage: JSONata
    Comment: Wait after each attempt, including attempt 1000, before invoking or starting a continuation. Absolute sample deadlines prevent Step Functions transition latency from accumulating.
    Timestamp: "{% $fromMillis($min([$ceil(($millis() + ($states.input.pollingSeconds * 1000)) / 1000) * 1000, $toMillis($states.input.stopAt)])) %}"
    Next: CheckDeadline
  ContinueCollection:
    Type: Task
    Resource: arn:aws:states:::states:startExecution
    Parameters:
      StateMachineArn.$: $$.StateMachine.Id
      Name.$: States.Hash($$.Execution.Id, 'SHA-256')
      Input:
        feedKey.$: $.feedKey
        pollingSeconds.$: $.pollingSeconds
        stopAt.$: $.stopAt
        AWS_STEP_FUNCTIONS_STARTED_BY_EXECUTION_ID.$: $$.Execution.Id
    Retry:
      - ErrorEquals:
          - StepFunctions.ExecutionLimitExceeded
          - StepFunctions.ThrottlingException
          - StepFunctions.ServiceUnavailable
        IntervalSeconds: 2
        BackoffRate: 2
        MaxAttempts: 3
    End: true
  InvalidCollection:
    Type: Fail
    Error: InvalidCollectionInput
    Cause: Supply a realtime feedKey, integer pollingSeconds meeting its provider minimum, and RFC3339 stopAt.
  CollectionComplete:
    Type: Succeed
