Comment: Manually collect realtime feeds until stopAt; continue in a new execution every 1000 attempts.
QueryLanguage: JSONPath
StartAt: ValidateCollection
States:
  ValidateCollection:
    Type: Choice
    QueryLanguage: JSONata
    Choices:
      - Condition: >-
          {% ($minimums := ${realtime_minimums}; $keys := $states.input.feedKeys;
          $type($keys) = 'array' and $count($keys) > 0 and $count($distinct($keys)) = $count($keys)
          and $count($filter($keys, function($key) { $type($key) = 'string' ? $not($exists($lookup($minimums, $key))) : true })) = 0
          and $type($states.input.pollingSeconds) = 'number' and $states.input.pollingSeconds = $floor($states.input.pollingSeconds)
          and $states.input.pollingSeconds >= $max($map($keys, function($key) { $lookup($minimums, $key) }))
          and $type($states.input.stopAt) = 'string'
          and $exists($match($states.input.stopAt, /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?(Z|[+-][0-9]{2}:[0-9]{2})$/))) %}
        Assign:
          iteration: 0
          deadline: "{% $floor($toMillis($states.input.stopAt) / 1000) * 1000 %}"
        Next: CheckCollection
    Default: InvalidCollection
  CheckCollection:
    Type: Choice
    QueryLanguage: JSONata
    Choices:
      - Condition: "{% $millis() >= $deadline %}"
        Next: CollectionComplete
      - Condition: "{% $iteration >= 1000 %}"
        Next: ContinueCollection
    Default: FetchRealtimeFeed
  FetchRealtimeFeed:
    Type: Task
    QueryLanguage: JSONata
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: "${realtime_fetcher_arn}"
      Payload:
        feedKeys: "{% $states.input.feedKeys %}"
        scheduledTime: "{% $states.context.State.EnteredTime %}"
    Assign:
      iteration: "{% $iteration + 1 %}"
    Output: "{% $states.input %}"
    Catch:
      - ErrorEquals:
          - States.ALL
        Assign:
          iteration: "{% $iteration + 1 %}"
        Output: "{% $states.input %}"
        Next: WaitForSample
    Next: WaitForSample
  WaitForSample:
    Type: Wait
    QueryLanguage: JSONata
    Comment: Wait after each attempt, including attempt 1000, before invoking or starting a continuation. Absolute sample deadlines prevent Step Functions transition latency from accumulating.
    Timestamp: "{% $fromMillis($min([$ceil(($millis() + ($states.input.pollingSeconds * 1000)) / 1000) * 1000, $deadline])) %}"
    Next: CheckCollection
  ContinueCollection:
    Type: Task
    Resource: arn:aws:states:::states:startExecution
    Parameters:
      StateMachineArn.$: $$.StateMachine.Id
      Name.$: States.Hash($$.Execution.Id, 'SHA-256')
      Input:
        feedKeys.$: $.feedKeys
        pollingSeconds.$: $.pollingSeconds
        stopAt.$: $.stopAt
        AWS_STEP_FUNCTIONS_STARTED_BY_EXECUTION_ID.$: $$.Execution.Id
    Retry:
      - ErrorEquals:
          - StepFunctions.ExecutionLimitExceeded
          - StepFunctions.ThrottlingException
          - StepFunctions.ServiceUnavailable
        IntervalSeconds: 2
        BackoffRate: 2
        MaxAttempts: 3
    End: true
  InvalidCollection:
    Type: Fail
    Error: InvalidCollectionInput
    Cause: Supply unique realtime feedKeys, integer pollingSeconds meeting every provider minimum, and RFC3339 stopAt.
  CollectionComplete:
    Type: Succeed
